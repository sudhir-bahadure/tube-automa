name: Daily Meme Shorts (High CTR)

on:
  # Manual only: the default YouTube credentials are shared with the psychology workflow.
  # Re-enable only after a separate meme-channel OAuth credential set is configured.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tubeautoma-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  meme_automation:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    strategy:
      # Serialize jobs because they share and commit the same topic-history file.
      max-parallel: 1
      matrix:
        time_slot: [morning, afternoon, evening]
      fail-fast: false  # Continue other jobs even if one fails
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Generate and Schedule Meme Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NICHE: "Viral Humorous Memes"
          VOICE_NAME: "en-US-GuyNeural"
          TIME_SLOT: ${{ matrix.time_slot }}
        run: |
          python -m src.main --type short --style stickman --schedule-for ${{ matrix.time_slot }}

      - name: Persist used topics
        if: always()
        run: |
          git config --global user.name "sudhir.tbahadure"
          git config --global user.email "sudhir.tbahadure@users.noreply.github.com"
          git add -f output/used_topics.json || echo "No topic file found"
          git commit -m "chore: update topic history [${{ matrix.time_slot }}] [skip ci]" || echo "No changes to commit"
          git push origin "$GITHUB_REF_NAME" || echo "Push failed"
