name: Weekly Psychology Documentary

on:
  schedule:
    # Weekly long-form upload; scheduled for 6 PM New York time by the Python scheduler.
    - cron: '30 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tubeautoma-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate, validate, upload and schedule
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "models/gemini-3.8-flash"
          GEMINI_FREE_TIER_ONLY: "true"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CURIOSITY_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.CURIOSITY_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.CURIOSITY_REFRESH_TOKEN }}
          NICHE: "Everyday psychology, human behaviour, cognitive biases and practical self-understanding"
          VOICE_NAME: "en-US-ChristopherNeural"
          YOUTUBE_SYNTHETIC_DISCLOSURE: "false"
          YOUTUBE_EXPECTED_CHANNEL_TITLE: "MARROW PSYCHOLOGY"
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ secrets.YOUTUBE_EXPECTED_CHANNEL_ID }}
        run: |
          python -m src.main --type long --style psych_stickman --schedule-for evening

      - name: Persist topic history on this branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/used_topics.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update psychology topic history [skip ci]"
          git push origin "$GITHUB_REF_NAME"
