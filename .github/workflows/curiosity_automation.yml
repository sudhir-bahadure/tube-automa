name: Curiosity Automation

on:
  schedule:
    # Four original psychology Shorts per week (Mon/Tue/Thu/Sat). Publish at 6 PM New York time.
    - cron: '30 15 * * 1,2,4,6'
  workflow_dispatch:
    inputs:
      type:
        description: 'Video type'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      private_test_upload:
        description: 'Upload privately without scheduling public release (recommended for first test)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tubeautoma-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'schedule' || vars.YOUTUBE_AUTOPUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Generate and Upload Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_FREE_TIER_ONLY: "true"
          GEMINI_BILLING_DISABLED_CONFIRMED: ${{ vars.GEMINI_BILLING_DISABLED_CONFIRMED }}
          YOUTUBE_SYNTHETIC_DISCLOSURE: "false"
          YOUTUBE_EXPECTED_CHANNEL_TITLE: "MARROW PSYCHOLOGY"
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ secrets.YOUTUBE_EXPECTED_CHANNEL_ID }}
          YOUTUBE_AUTOPUBLISH_ENABLED: ${{ vars.YOUTUBE_AUTOPUBLISH_ENABLED }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CURIOSITY_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.CURIOSITY_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.CURIOSITY_REFRESH_TOKEN }}
          NICHE: "Everyday psychology, human behaviour, cognitive biases and practical self-understanding"
          VOICE_NAME: "en-US-ChristopherNeural"
        run: |
          TYPE="${{ github.event.inputs.type }}"
          if [ -z "$TYPE" ]; then TYPE="short"; fi
          if [ "${{ github.event.inputs.private_test_upload }}" = "true" ]; then
            python -m src.main --type "$TYPE" --style psych_stickman --schedule-for evening --private-test-upload
          else
            python -m src.main --type "$TYPE" --style psych_stickman --schedule-for evening
          fi

      - name: Persist used topics
        if: success()
        run: |
          git config --global user.name "sudhir.tbahadure"
          git config --global user.email "sudhir.tbahadure@users.noreply.github.com"
          git add -f output/used_topics.json || echo "No topic file found"
          git commit -m "chore: update topic history [skip ci]" || echo "No changes to commit"
          git push origin "$GITHUB_REF_NAME"

      - name: Upload private analytics snapshot
        if: always() && hashFiles('output/analytics_snapshot.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: marrow-analytics-${{ github.run_id }}
          path: output/analytics_snapshot.json
          retention-days: 14
