name: Curiosity Automation

on:
  schedule:
    # One original psychology Short per day. Publishing is scheduled for 6 PM New York time.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Video type'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long

permissions:
  contents: write

concurrency:
  group: tubeautoma-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Generate and Upload Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "models/gemini-3.8-flash"
          GEMINI_FREE_TIER_ONLY: "true"
          YOUTUBE_SYNTHETIC_DISCLOSURE: "false"
          YOUTUBE_EXPECTED_CHANNEL_TITLE: "MARROW PSYCHOLOGY"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.CURIOSITY_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.CURIOSITY_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.CURIOSITY_REFRESH_TOKEN }}
          NICHE: "Everyday psychology, human behaviour, cognitive biases and practical self-understanding"
          VOICE_NAME: "en-US-ChristopherNeural"
        run: |
          TYPE="${{ github.event.inputs.type }}"
          if [ -z "$TYPE" ]; then TYPE="short"; fi
          python -m src.main --type "$TYPE" --style psych_stickman --schedule-for evening

      - name: Persist used topics
        if: always()
        run: |
          git config --global user.name "sudhir.tbahadure"
          git config --global user.email "sudhir.tbahadure@users.noreply.github.com"
          git add -f output/used_topics.json || echo "No topic file found"
          git commit -m "chore: update topic history [skip ci]" || echo "No changes to commit"
          git push origin "$GITHUB_REF_NAME" || echo "Push failed"
